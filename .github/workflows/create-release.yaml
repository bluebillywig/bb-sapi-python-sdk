name: Create release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override, e.g. 1.1.0. Leave empty to use the version in pyproject.toml (the normal case)."
        required: false
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate branch
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^release/v[0-9]+\.[0-9]+$ ]]; then
            echo "::error::This workflow must be run from a release branch (release/v*.*), got '$GITHUB_REF_NAME'"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      # pyproject.toml is the single source of truth for the version: it is what
      # reviewers see in the PR, what publish.yaml stamps into the wheel, and
      # what bb_sapi.__version__ reports at runtime.
      #
      # This step used to guess the version by incrementing the newest GitHub
      # release tag instead. That is a second, independent source of truth, and
      # the two drifted: 1.0.0 was published to PyPI without ever being tagged,
      # so the guess restarted at 1.0.0 and would have failed against a version
      # PyPI already had.
      - name: Resolve version
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ -n "$VERSION_OVERRIDE" ]]; then
            VERSION="$VERSION_OVERRIDE"
            echo "Using the supplied override: $VERSION"
          else
            VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)
            echo "Using the version declared in pyproject.toml: $VERSION"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a major.minor.patch version."
            exit 1
          fi

          # A release cut from release/v1.1 must be a 1.1.x. Without this, an
          # un-bumped pyproject would quietly tag the wrong line.
          MAJOR_MINOR="${GITHUB_REF_NAME#release/v}"
          if [[ "$VERSION" != "$MAJOR_MINOR."* ]]; then
            echo "::error::Version $VERSION does not belong on branch $GITHUB_REF_NAME."
            echo "::error::Bump pyproject.toml to a ${MAJOR_MINOR}.x version, or cut this release from release/v${VERSION%.*}."
            exit 1
          fi

          PACKAGE=$(sed -n 's/^name = "\(.*\)"/\1/p' pyproject.toml | head -n 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

      # Fail here, with an explanation, rather than in publish.yaml with an
      # opaque 400 from PyPI. A version can only be uploaded once.
      - name: Refuse to re-release an existing version
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE: ${{ steps.version.outputs.package }}
        run: |
          set -euo pipefail

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Bump the version in pyproject.toml."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the version in pyproject.toml."
            exit 1
          fi

          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/${PACKAGE}/${VERSION}/json")
          if [[ "$STATUS" == "200" ]]; then
            echo "::error::${PACKAGE} ${VERSION} is already on PyPI, which never accepts the same version twice."
            echo "::error::Bump the version in pyproject.toml and try again."
            exit 1
          fi
          echo "$PACKAGE $VERSION is free to publish (PyPI answered $STATUS)."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "$GITHUB_REF_NAME" \
            --title "$TAG" \
            --generate-notes
